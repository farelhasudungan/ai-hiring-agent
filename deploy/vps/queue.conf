[program:ai-hiring-dev-worker]
process_name=%(program_name)s_%(process_num)02d
directory=/var/www/ai-hiring-dev/current
command=/usr/bin/php8.4 /var/www/ai-hiring-dev/current/artisan queue:work database --sleep=3 --tries=3 --timeout=60 --max-time=3600
user=deploy
numprocs=1
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=90
redirect_stderr=true
stdout_logfile=/var/www/ai-hiring-dev/shared/storage/logs/worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
umask=0007
